<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>พื้นหลังส่วนผู้สอน 5 แบบ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#EEF1F6;font-family:"Anuphan","Leelawadee UI",sans-serif;color:#0F172A;padding:20px}
h2{margin:26px 0 10px;font-size:18px}
.sec{position:relative;overflow:hidden;border-radius:24px;min-height:440px;display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:30px;align-items:end;padding:40px 44px 0}
.sec img.me{position:relative;z-index:2;width:100%;display:block;align-self:end}
.txt{position:relative;z-index:2;align-self:center;padding-bottom:40px}
.txt h3{margin:0 0 4px;font-size:26px}.txt .role{font-weight:600;margin:0 0 12px}.txt p{margin:0 0 16px;line-height:1.75;font-size:15px}
.btn{display:inline-block;background:#1D4ED8;color:#fff;padding:10px 20px;border-radius:10px;font-weight:600}
.bg{position:absolute;inset:0;z-index:0}
/* 1 */
.s1{background:linear-gradient(135deg,#0A1B4D,#1D4ED8);color:#fff}.s1 .role{color:#93C5FD}
.s1 .big{position:absolute;right:-20px;top:-30px;font:900 190px/1 Inter,sans-serif;color:rgba(255,255,255,.06);letter-spacing:-.04em}
.s1 .glow{position:absolute;left:60px;bottom:-80px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(96,165,250,.7),transparent 65%)}
/* 2 */
.s2{background:#040814;color:#fff}.s2 .role{color:#60A5FA}
.s2 .grid{background-image:linear-gradient(rgba(96,165,250,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,.14) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 25% 80%,#000,transparent 70%)}
.s2 .spot{position:absolute;left:0;bottom:0;width:460px;height:100%;background:radial-gradient(ellipse at 50% 100%,rgba(59,130,246,.55),transparent 65%)}
/* 3 */
.s3{background:linear-gradient(180deg,#0B1F5E,#071235);color:#fff}.s3 .role{color:#FACC15}
.s3 svg{position:absolute;left:0;bottom:0;width:100%;height:70%;opacity:.5}
/* 4 */
.s4{background:#2563EB;color:#fff;background-image:radial-gradient(rgba(255,255,255,.1) 1.5px,transparent 1.5px);background-size:22px 22px}.s4 .role{color:#FDE68A}
.s4 .arrow{position:absolute;left:30px;top:30px;width:150px;height:130px;background:#FACC15;clip-path:polygon(0 70%,40% 35%,55% 55%,80% 18%,70% 10%,100% 0,95% 35%,88% 28%,56% 78%,40% 58%,10% 90%);transform:rotate(-4deg)}
.s4 .bars{position:absolute;left:30px;bottom:0;display:flex;gap:12px;align-items:flex-end}.s4 .bars i{display:block;width:44px;background:#FACC15;border-radius:4px 4px 0 0}
.s4 .circ{position:absolute;left:70px;bottom:-60px;width:380px;height:380px;border-radius:50%;background:#F8FAFC}
.s4 img.me{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #fff)}
/* 5 */
.s5{background:#F8FAFF;border:1px solid #E2E8F0}
.s5 .circ{position:absolute;left:30px;bottom:-110px;width:440px;height:440px;border-radius:50%;background:#DBEAFE}
.s5 .chip{position:absolute;z-index:3;background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:8px 14px;font:800 15px Inter,sans-serif;box-shadow:0 8px 24px rgba(15,23,42,.1);display:flex;gap:8px;align-items:center}
.s5 .chip b{color:#16A34A}.s5 .chip em{font-style:normal;color:#DC2626}
.s5 .dots{background-image:radial-gradient(#CBD5E1 1.5px,transparent 1.5px);background-size:26px 26px;-webkit-mask-image:linear-gradient(90deg,#000,transparent 80%)}
@media(max-width:700px){.sec{grid-template-columns:1fr;padding:30px 20px 0;text-align:center}.sec img.me{max-width:260px;margin:0 auto}}
</style></head><body>
<template id="t"><div class="txt"><h3>มาร์ค</h3><p class="role">ผู้ก่อตั้งและผู้สอน INVESTOPIA</p><p>ผมลงทุนมาประมาณ 5 ปี เริ่มจากหุ้นไทยแบบมั่วๆ ไม่ดูกราฟ ไม่ดูพื้นฐาน ฟังคนอื่นแล้วรู้สึกว่าดีก็ซื้อ ผลคือขาดทุนหลายหมื่นบาท ผมเลยทำคอร์สนี้ขึ้นมา ย่อยให้ง่าย ลงมือทำตามได้</p><span class="btn">เริ่มเรียนกับเรา</span></div></template>

<h2>แบบ 1 · น้ำเงินไล่เฉด + แสงเรืองใต้ตัว + ตัวหนังสือ INVESTOPIA ตัวใหญ่จาง</h2>
<div class="sec s1" id="a"><div class="bg"><div class="big">INVESTOPIA</div><div class="glow"></div></div><img class="me" src="../public/instructor.png"></div>

<h2>แบบ 2 · มืดเข้ม + เส้นกริดแบบกราฟ + สปอตไลต์</h2>
<div class="sec s2" id="b"><div class="bg"><div class="grid" style="position:absolute;inset:0"></div><div class="spot"></div></div><img class="me" src="../public/instructor.png"></div>

<h2>แบบ 3 · กราฟแท่งเทียนเต็มฉากหลัง</h2>
<div class="sec s3" id="c"><div class="bg"><svg id="candles" viewBox="0 0 1200 300" preserveAspectRatio="none"></svg></div><img class="me" src="../public/instructor.png"></div>

<h2>แบบ 4 · สไตล์กระดาษตัด (เข้ากับโลโก้การ์ตูน) ลูกศร + แท่งสีเหลือง</h2>
<div class="sec s4" id="d"><div class="bg"><div class="arrow"></div><div class="bars"><i style="height:50px"></i><i style="height:90px"></i><i style="height:130px"></i><i style="height:180px"></i></div></div><img class="me" src="../public/instructor.png"></div>

<h2>แบบ 5 · สว่าง สะอาด + วงกลมฟ้า + ป้ายหุ้นลอย</h2>
<div class="sec s5" id="e"><div class="bg"><div class="dots" style="position:absolute;inset:0"></div><div class="circ"></div></div>
 <span class="chip" style="left:36px;top:70px">NVDA <b>▲</b></span><span class="chip" style="left:300px;top:130px">PTT <em>▼</em></span><span class="chip" style="left:70px;top:210px">AOT <b>▲</b></span>
 <img class="me" src="../public/instructor.png"></div>
<script>
for(const id of ['a','b','c','d','e']){const s=document.getElementById(id);s.appendChild(document.getElementById('t').content.cloneNode(true));}
let x=0,p=240,h='';const r=(()=>{let s=9;return()=>(s=s*16807%2147483647)/2147483647})();
for(let i=0;i<40;i++){const cx=15+i*30,o=p;p=Math.max(40,Math.min(260,p+(r()-.6)*40));const c=p,col=c<o?'#22C55E':'#EF4444';h+=`<line x1="${cx}" x2="${cx}" y1="${Math.min(o,c)-10}" y2="${Math.max(o,c)+10}" stroke="${col}" stroke-width="2"/><rect x="${cx-8}" y="${Math.min(o,c)}" width="16" height="${Math.abs(o-c)+3}" fill="${col}"/>`}
document.getElementById('candles').innerHTML=h;
</script></body></html>
